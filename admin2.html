<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Admin Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--ink:#0b0b0f;--paper:#f4f1ea;--blue:#2f5bff;--tint:#dfe7ff;--yellow:#ffd23f;--red:#ff4d4d;--green:#22c55e;--muted:#5d5a55;
--head:"Archivo Black",Impact,system-ui,sans-serif;--body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));color:var(--ink);font:500 15px/1.45 var(--body);overflow-x:hidden;
  background-color:var(--paper);background-image:linear-gradient(rgba(11,11,15,.07) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(11,11,15,.07) 1.5px,transparent 1.5px);background-size:32px 32px}
main{position:relative;z-index:1;max-width:460px;margin:auto}
.deco{position:fixed;z-index:0;pointer-events:none;border:3px solid var(--ink)}
.d1{width:90px;height:90px;right:-30px;top:90px;background:var(--yellow);border-radius:50%;box-shadow:4px 4px 0 var(--ink);animation:bob 5s ease-in-out infinite alternate}
.d2{width:64px;height:64px;left:-22px;bottom:110px;background:var(--tint);transform:rotate(14deg);box-shadow:4px 4px 0 var(--blue);animation:bob 6.5s ease-in-out infinite alternate}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
h1{margin:0;font:400 28px/1 var(--head);text-transform:uppercase;letter-spacing:.01em;text-shadow:3px 3px 0 var(--tint)}
.badge{padding:6px 10px 5px;border-radius:6px;background:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--blue);font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;transform:rotate(-3deg);white-space:nowrap}

.card{position:relative;margin-bottom:22px;padding:24px 16px 16px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:7px 7px 0 var(--ink);animation:slam .55s cubic-bezier(.3,1.5,.5,1) both}
.card::before{content:"";position:absolute;top:-13px;left:50%;width:70px;height:22px;margin-left:-35px;border:3px solid var(--ink);border-radius:4px;background:var(--tint);transform:rotate(-3deg)}
.card:nth-child(2n)::before{background:var(--yellow);transform:rotate(3deg)}
.ttl{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:400 16px/1.1 var(--head);text-transform:uppercase}
.num{flex:none;width:34px;height:34px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:8px;background:var(--blue);color:#fff;box-shadow:2px 2px 0 var(--ink);font:400 16px/1 var(--head)}
label{display:block;margin:0 0 5px;font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,select{width:100%;height:48px;margin:0 0 12px;padding:0 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:700 16px var(--body);box-shadow:3px 3px 0 var(--ink);outline:0;transition:transform .1s,box-shadow .1s,background .15s}
input::placeholder{color:#a8a39b;font-weight:500}
input:focus,select:focus{background:var(--tint);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--blue)}
.link{margin:0;padding:8px 10px;border:2px dashed var(--ink);border-radius:8px;background:var(--paper);font:700 11.5px/1.35 var(--body);color:var(--muted);word-break:break-all}

button{width:100%;height:52px;border:3px solid var(--ink);border-radius:12px;background:var(--blue);color:#fff;cursor:pointer;
  font:700 15px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;box-shadow:5px 5px 0 var(--ink);transition:background .15s,transform .1s,box-shadow .1s}
button:hover{background:var(--ink)}
button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button.alt{margin-top:14px;background:var(--yellow);color:var(--ink)}
button.alt:hover{background:#fff}
#addBtn{margin:0 0 22px}
button.del{width:auto;height:32px;margin-left:auto;padding:0 10px;border-radius:8px;background:var(--red);color:#fff;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
button.del:hover{background:var(--ink)}

#msg{display:none;margin:0 0 20px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);font:700 13.5px/1.35 var(--body);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
#msg.ok{display:block;background:var(--green)}
#msg.bad{display:block;background:var(--red);color:#fff}
[hidden]{display:none!important}
@keyframes slam{from{opacity:0;transform:translateY(-22px) rotate(-3deg) scale(1.05)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes bob{to{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head>
<body>
<div class="deco d1" aria-hidden="true"></div><div class="deco d2" aria-hidden="true"></div>
<main>
<div class="top"><h1>Admin Key</h1><span class="badge">Panel</span></div>
<div id="msg" role="status"></div>

<section id="login" class="card">
  <div class="ttl">Login admin</div>
  <label for="em">Email</label>
  <input id="em" type="email" placeholder="admin@email.com" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
  <button id="loginBtn" type="button">Masuk</button>
</section>

<section id="panel" hidden>
  <div id="list"></div>
  <button class="alt" id="addBtn" type="button">+ Tambah aplikasi</button>
  <button id="saveAll" type="button">Simpan semua</button>
  <button class="alt" id="out" type="button">Keluar</button>
</section>
</main>

<script>
(function(){
  var msg = location.protocol === 'file:'
    ? 'Halaman dibuka dari file lokal (file://). Upload ke hosting dan buka lewat https://.'
    : 'Script Firebase gagal dimuat. Cek koneksi internet / VPN / pemblokir iklan (gstatic.com tidak boleh diblokir), lalu refresh paksa.';
  function show(){ var m=document.getElementById('msg'); m.className='bad'; m.textContent=msg; }
  document.getElementById('loginBtn').addEventListener('click', function(){ if(!window.__adminOk) show(); });
  setTimeout(function(){ if(!window.__adminOk) show(); }, 3000);
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDocs, collection, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDxlcMvfZ1nhJ8WYbjR_y50N7EaY71gRIY",
  authDomain: "free-key-3024b.firebaseapp.com",
  projectId: "free-key-3024b",
  storageBucket: "free-key-3024b.firebasestorage.app",
  messagingSenderId: "766189284478",
  appId: "1:766189284478:web:524ba727e03eedde53bc2f"
};

window.__adminOk = true;
const DEFAULT_APPS = ['TARZ PROXY V1', 'TARZ MODZ PROXY', 'TARZ X MODZ', '8 BALL POOL V10']; // dipakai hanya jika database masih kosong
let ids = [];
const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app);
const $ = (id) => document.getElementById(id);
const say = (t, bad) => { const m = $('msg'); m.className = ''; m.textContent = t; if (t) { void m.offsetWidth; m.className = bad ? 'bad' : 'ok'; } };
const rand = () => { const P = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for (let i = 0; i < 5; i++) r += P[Math.floor(Math.random() * P.length)]; return r; };

const base = location.origin + location.pathname.replace(/[^/]*$/, '');
const sync = (id) => { const up = $('m' + id).value === 'userpass'; $('kb' + id).hidden = up; $('ub' + id).hidden = !up; };

function addCard(id, d = {}) {
  $('list').insertAdjacentHTML('beforeend', `
  <div class="card" id="card${id}">
    <div class="ttl"><span class="num">${id}</span>Aplikasi<button type="button" class="del" data-del="${id}">Hapus</button></div>
    <label for="a${id}">Nama aplikasi</label>
    <input id="a${id}" placeholder="mis. TARZ PROXY V1" autocomplete="off">
    <label for="m${id}">Tipe</label>
    <select id="m${id}"><option value="key">Key</option><option value="userpass">Username &amp; Password</option></select>
    <div id="kb${id}">
      <label for="k${id}">Key</label>
      <input id="k${id}" placeholder="Ketik key di sini" autocomplete="off" spellcheck="false">
    </div>
    <div id="ub${id}" hidden>
      <label for="n${id}">Username</label>
      <input id="n${id}" placeholder="Ketik username" autocomplete="off" spellcheck="false">
      <label for="p${id}">Password</label>
      <input id="p${id}" placeholder="Ketik password" autocomplete="off" spellcheck="false">
    </div>
    <label for="u${id}">Berlaku sampai (opsional)</label>
    <input id="u${id}" placeholder="mis. 31-12-2026" autocomplete="off">
    <p class="link">Link VPLink: ${base}key.html?k=${id}</p>
  </div>`);
  $('a' + id).value = d.name || '';
  $('m' + id).value = d.mode === 'userpass' ? 'userpass' : 'key';
  $('k' + id).value = d.key || '';
  $('n' + id).value = d.username || '';
  $('p' + id).value = d.password || '';
  $('u' + id).value = d.until || '';
  $('m' + id).onchange = () => sync(id);
  sync(id);
  ids.push(id);
}

async function load() {
  const snap = await getDocs(collection(db, 'vpkeys'));
  const rows = snap.docs.filter((x) => /^\d+$/.test(x.id)).map((x) => ({ id: x.id, ...x.data() })).sort((a, b) => a.id - b.id);
  $('list').innerHTML = ''; ids = [];
  if (rows.length) rows.forEach((r) => addCard(r.id, r));
  else DEFAULT_APPS.forEach((n, i) => addCard(String(i + 1), { name: n }));
}

$('addBtn').onclick = () => {
  const id = String(Math.max(0, ...ids.map(Number)) + 1);
  addCard(id);
  $('card' + id).scrollIntoView({ behavior: 'smooth', block: 'center' });
  $('a' + id).focus();
  say('Aplikasi ' + id + ' ditambahkan. Isi datanya lalu klik Simpan semua.');
};

$('list').onclick = async (e) => {
  const b = e.target.closest('[data-del]');
  if (!b) return;
  const id = b.dataset.del, nm = $('a' + id).value.trim() || ('Aplikasi ' + id);
  if (!confirm('Hapus "' + nm + '"? Link key.html?k=' + id + ' akan berhenti bekerja.')) return;
  try { await deleteDoc(doc(db, 'vpkeys', id)); }
  catch (err) { say('Gagal menghapus (cek login / rules Firebase).', true); return; }
  $('card' + id).remove();
  ids = ids.filter((x) => x !== id);
  say('"' + nm + '" dihapus.');
};

$('loginBtn').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); say(''); }
  catch (e) {
    const m = {
      'auth/invalid-credential': 'Email atau password salah (atau user belum dibuat di Authentication).',
      'auth/invalid-api-key': 'apiKey Firebase salah.',
      'auth/operation-not-allowed': 'Email/Password belum diaktifkan di Authentication > Sign-in method.',
      'auth/unauthorized-domain': 'Domain situs belum ditambahkan di Authentication > Settings > Authorized domains.',
      'auth/network-request-failed': 'Gagal terhubung ke Firebase (cek internet / config).',
      'auth/too-many-requests': 'Terlalu banyak percobaan, tunggu beberapa menit.',
      'auth/invalid-email': 'Format email salah.'
    };
    say('Login gagal [' + (e.code || e.message) + ']: ' + (m[e.code] || 'lihat kode di dalam kurung.'), true);
    console.error(e);
  }
};
$('out').onclick = () => signOut(auth);

$('saveAll').onclick = async () => {
  try {
    for (const id of ids) {
      await setDoc(doc(db, 'vpkeys', id), {
        name: $('a' + id).value.trim() || ('Aplikasi ' + id),
        mode: $('m' + id).value,
        key: $('k' + id).value.trim(),
        username: $('n' + id).value.trim(),
        password: $('p' + id).value.trim(),
        until: $('u' + id).value.trim(),
        updated: serverTimestamp()
      });
    }
    say('Tersimpan. Perubahan langsung aktif.');
  } catch (e) { say('Gagal menyimpan (cek login / rules Firebase).', true); }
};

onAuthStateChanged(auth, async (u) => {
  $('login').hidden = !!u; $('panel').hidden = !u;
  if (u) { try { await load(); } catch (e) { say('Gagal memuat data.', true); } }
});
</script>
</body></html>
