<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your key · TARZ STORE</title>
<meta name="theme-color" content="#7fc4ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--ink:#0b0b0b;--bg:#7fc4ff;--blue:#0b5fd6;--blue2:#3d8bff;--tint:#e6f3ff;--yellow:#ffd60a;--white:#fff;--muted:#4b5563;
--head:"Archivo Black",Impact,system-ui,sans-serif;--body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
--bd:3px solid var(--ink);--ease:cubic-bezier(.3,1.5,.5,1)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
  padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));
  color:var(--ink);font:500 15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 380px at 85% -5%,rgba(11,95,214,.36),transparent 70%),
  linear-gradient(rgba(0,0,0,.06) 1.5px,transparent 1.5px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(0,0,0,.06) 1.5px,transparent 1.5px) 0 0/32px 32px}
main{position:relative;z-index:1;width:100%;max-width:400px;margin:auto 0}
[hidden]{display:none!important}

/* ---------- dekorasi ---------- */
.o{position:fixed;z-index:0;pointer-events:none}
.o svg{display:block;width:100%;height:100%;fill:var(--white);stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.o polygon{fill:var(--c,var(--white))}
.spin{animation:spin var(--t,20s) linear infinite}
.bob{animation:bob var(--t,5s) ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.half{border:var(--bd);border-radius:50%;background:radial-gradient(var(--ink) 1.7px,transparent 2.2px) 0 0/10px 10px,var(--yellow);box-shadow:4px 4px 0 var(--blue)}

/* ---------- header ---------- */
.top{display:flex;justify-content:center;margin-bottom:22px}
.brand{position:relative;overflow:hidden;display:inline-block;padding:10px 20px 8px;border:var(--bd);border-radius:12px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));color:var(--white);text-shadow:2px 2px 0 var(--ink);
  font:400 20px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;box-shadow:4px 4px 0 var(--yellow),4px 4px 0 3px var(--ink);
  transform:rotate(-2deg);animation:slam .7s var(--ease) both}

/* ---------- kartu ---------- */
.card{position:relative;padding:28px 20px 22px;border:var(--bd);border-radius:20px;background:var(--white);
  box-shadow:8px 8px 0 var(--yellow),8px 8px 0 3px var(--ink);animation:slam .7s .08s var(--ease) both}
.stage{display:none;position:relative;text-align:center}
.stage.on{display:block;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.stage h2{margin:0 0 6px;font:400 22px/1.15 var(--head);letter-spacing:.01em;text-transform:uppercase}
.stage p{margin:0;color:var(--muted);font-size:14px}

/* loader */
.pctwrap{position:relative;width:128px;height:128px;margin:0 auto 18px;display:grid;place-items:center}
.pctwrap svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 9s linear infinite}
.sb{fill:var(--blue);stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.pct{position:relative;z-index:1;color:var(--white);text-shadow:2px 2px 0 var(--ink);font:400 36px/1 var(--head);font-variant-numeric:tabular-nums}
.pct small{font-size:15px;margin-left:2px}
.pctwrap.full .pct{animation:thump .5s}
.bar{position:relative;height:22px;margin:20px 0 0;border:var(--bd);border-radius:8px;background:var(--white);box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(-45deg,var(--blue) 0 10px,var(--blue2) 10px 20px);background-size:28px 28px;animation:stripes .6s linear infinite}
.fill::after{content:"";position:absolute;top:0;right:0;bottom:0;width:3px;background:var(--ink);opacity:var(--e,0)}
.steps{list-style:none;margin:20px 0 0;padding:14px 16px;display:grid;gap:12px;text-align:left;border:var(--bd);border-radius:14px;background:var(--tint)}
.step{display:flex;align-items:center;gap:12px;font:700 12.5px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.45;transition:opacity .3s}
.step .d{flex:none;position:relative;width:22px;height:22px;border:var(--bd);border-radius:6px;background:var(--white);transition:background .2s}
.step.active{opacity:1}
.step.active .d{background:var(--yellow);animation:blink .8s steps(2) infinite}
.step.done{opacity:1}
.step.done .d{background:var(--blue);animation:thump .35s}
.step.done .d::after{content:"";position:absolute;left:5px;top:0;width:5px;height:11px;border:solid var(--white);border-width:0 3px 3px 0;transform:rotate(45deg)}

/* sukses */
.okrow{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:6px}
.okwrap{position:relative;width:64px;height:64px;display:grid;place-items:center;animation:pop .55s var(--ease) both}
.okwrap svg.s{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
.okwrap .tick{position:relative;z-index:1;width:28px;height:28px;filter:drop-shadow(1.5px 1.5px 0 var(--ink))}
.tick path{fill:none;stroke:var(--white);stroke-width:6;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:36;stroke-dashoffset:36;animation:draw .4s .3s forwards}
.badge{display:inline-block;padding:6px 12px 5px;border-radius:6px;background:var(--ink);color:var(--white);box-shadow:3px 3px 0 var(--blue);font:700 11.5px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;transform:rotate(-2deg);animation:pop .5s .1s var(--ease) both}
.lab{margin:18px 0 0;text-align:left;color:var(--muted);font:700 11.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}
.keybox{margin:8px 0 12px;padding:18px 10px 16px;border:var(--bd);border-radius:12px;background:var(--white);box-shadow:4px 4px 0 var(--ink);text-align:center;user-select:all;overflow-wrap:anywhere;
  font:800 clamp(24px,8.4vw,32px)/1.2 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.1em;text-indent:.1em;transition:background .4s}
.c{display:inline-block;color:#9db8e0}
.c.set{color:var(--ink);animation:thump .3s}
.c.dash{color:var(--blue)}
.keybox.done{background:var(--tint)}
.keybox.done .c.set{color:var(--ink)}
#userBox,#passBox{margin:8px 0 10px;padding:14px 10px 12px;font-size:clamp(18px,5.8vw,22px);letter-spacing:.06em;text-indent:.06em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:2px;border:var(--bd);border-radius:12px;background:var(--blue);color:var(--white);cursor:pointer;
  font:700 14px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;box-shadow:4px 4px 0 var(--ink);transition:background .15s,color .15s,transform .1s,box-shadow .1s}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover{background:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.ok{background:var(--yellow);color:var(--ink)}
.btn.sm{height:42px;font-size:12.5px}
.actions{opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.actions.on{opacity:1;transform:none}
.hint{margin:16px 0 0!important;padding-top:14px;border-top:2.5px dashed rgba(0,0,0,.25);font-size:12.5px!important;font-weight:700!important;color:var(--muted)!important}
.foot{margin-top:22px;text-align:center;font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.55)}

.burst{position:absolute;left:50%;width:0;height:0;pointer-events:none;z-index:5}
.burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border:2px solid var(--ink);animation:fly 1.1s cubic-bezier(.1,.7,.2,1) forwards}

@keyframes slam{from{opacity:0;transform:translateY(-24px) rotate(-5deg) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-10deg)}}
@keyframes spin{to{rotate:360deg}}
@keyframes bob{to{translate:0 -14px}}
@keyframes twinkle{50%{transform:scale(.7) rotate(25deg)}}
@keyframes thump{50%{transform:scale(1.15)}}
@keyframes blink{50%{background:var(--white)}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sp" viewBox="0 0 24 24"><path d="M12 1C13 8 16 11 23 12C16 13 13 16 12 23C11 16 8 13 1 12C8 11 11 8 12 1Z"/></symbol>
</svg>
<div id="deco" aria-hidden="true"></div>
<main>
  <div class="top"><div class="brand">TARZ STORE</div></div>
  <section class="card">
    <div class="stage on" id="loadView">
      <div class="pctwrap" id="pctwrap">
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon class="sb" data-burst="12,46,36"/></svg>
        <div class="pct"><b id="pct">0</b><small>%</small></div>
      </div>
      <h2 id="ldTitle">Creating your key</h2>
      <p>Please wait, don't close this page.</p>
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <ul class="steps">
        <li class="step"><span class="d"></span><span class="t">Checking verification</span></li>
        <li class="step"><span class="d"></span><span class="t">Creating key</span></li>
        <li class="step"><span class="d"></span><span class="t">Securing key</span></li>
      </ul>
    </div>

    <div class="stage" id="keyView">
      <div class="okrow">
        <div class="okwrap" aria-hidden="true">
          <svg class="s" viewBox="0 0 100 100"><polygon class="sb" data-burst="12,46,36"/></svg>
          <svg class="tick" viewBox="0 0 48 48"><path d="M10 25l10 10 18-20"/></svg>
        </div>
        <span class="badge">Verification successful</span>
      </div>
      <div id="keyOnly">
        <div class="lab">Your key</div>
        <div class="keybox" id="keyBox" aria-live="polite"></div>
        <div class="actions"><button class="btn" type="button" data-copy="key"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy key</span></button></div>
      </div>
      <div id="upOnly" hidden>
        <div class="lab">Username</div>
        <div class="keybox" id="userBox" aria-live="polite"></div>
        <div class="actions"><button class="btn sm" type="button" data-copy="user"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy username</span></button></div>
        <div class="lab">Password</div>
        <div class="keybox" id="passBox" aria-live="polite"></div>
        <div class="actions"><button class="btn sm" type="button" data-copy="pass"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy password</span></button></div>
      </div>
      <div class="actions"><p class="hint">Copy it, then paste it in the app.</p></div>
    </div>
  </section>
  <div class="foot">Free key · TARZ STORE</div>
</main>

<script>
  // Salin key dari License Panel ke sini.
  // 'until' hanya teks yang ditampilkan (isi sesuai expiry di panel, kosongkan jika tanpa batas).
  // Data diambil dari Firebase (diisi lewat admin). mode 'key' = Key saja, 'up' = Username & Password. Link: key.html?k=TOKEN (token acak dari admin)
  let KEY = { mode: 'key', key: '', user: '', pass: '', until: '' };
  const APPK = (new URLSearchParams(location.search).get('k') || '').trim();
  const LOAD_MS = 4500; // lama animasi sebelum key tampil (milidetik)

  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const POOL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ---------- bentuk bintang ----------
  const burstPts = (n, ro, ri) => {
    let p = '';
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? ri : ro, a = (Math.PI * i) / n - Math.PI / 2;
      p += (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1) + ' ';
    }
    return p;
  };
  document.querySelectorAll('[data-burst]').forEach((el) => {
    const [n, ro, ri] = el.dataset.burst.split(',').map(Number);
    el.setAttribute('points', burstPts(n, ro, ri));
  });

  // ---------- loader ----------
  function runLoader(done) {
    const pct = $('pct'), fill = $('fill');
    const steps = [...document.querySelectorAll('.step')];
    const marks = [0, 35, 70, 101];
    const t0 = performance.now();
    (function frame(now) {
      const t = Math.min((now - t0) / LOAD_MS, 1);
      const p = Math.round(ease(t) * 100);
      pct.textContent = p;
      fill.style.width = p + '%';
      fill.style.setProperty('--e', p > 0 ? 1 : 0);
      steps.forEach((s, i) => { s.className = 'step' + (p >= marks[i + 1] ? ' done' : p >= marks[i] ? ' active' : ''); });
      if (t < 1) return requestAnimationFrame(frame);
      steps.forEach((s) => { s.className = 'step done'; });
      $('pctwrap').classList.add('full');
      setTimeout(done, 800);
    })(t0);
  }

  // ---------- confetti kotak ----------
  function burst() {
    if (reduce) return;
    const box = KEY.mode === 'up' ? $('upOnly') : $('keyBox'), wrap = document.createElement('div');
    wrap.className = 'burst';
    wrap.style.top = (box.offsetTop + box.offsetHeight / 2) + 'px';
    const colors = ['var(--blue)', 'var(--ink)', 'var(--yellow)', 'var(--white)'];
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 120, e = document.createElement('i');
      e.style.setProperty('--x', Math.cos(a) * d + 'px');
      e.style.setProperty('--y', Math.sin(a) * d * .8 + 'px');
      e.style.setProperty('--r', (Math.random() * 360) + 'deg');
      e.style.background = colors[i % colors.length];
      if (i % 3 === 0) e.style.borderRadius = '50%';
      wrap.appendChild(e);
    }
    $('keyView').appendChild(wrap);
    setTimeout(() => wrap.remove(), 1300);
  }

  // ---------- teks terungkap ----------
  function decode(box, text) {
    return new Promise((resolve) => {
      const chars = [...text];
      box.textContent = '';
      const spans = chars.map((c, i) => {
        const s = document.createElement('span');
        s.className = c === '-' ? 'c dash' : 'c';
        s.style.setProperty('--k', i);
        if (c === '-') { s.textContent = '-'; s.ready = true; }
        box.appendChild(s);
        return s;
      });
      const end = () => { box.classList.add('done'); resolve(); };
      if (reduce) { chars.forEach((c, i) => { spans[i].textContent = c; if (c !== '-') spans[i].classList.add('set'); }); return end(); }
      const t0 = performance.now();
      const timer = setInterval(() => {
        const el = performance.now() - t0;
        let all = true;
        chars.forEach((c, i) => {
          if (spans[i].ready) return;
          if (el >= 300 + i * 110) { spans[i].textContent = c; spans[i].classList.add('set'); spans[i].ready = true; }
          else { all = false; spans[i].textContent = POOL[Math.floor(Math.random() * POOL.length)]; }
        });
        if (all) { clearInterval(timer); end(); }
      }, 50);
    });
  }

  function reveal() {
    const up = KEY.mode === 'up';
    $('loadView').classList.remove('on');
    $('keyView').classList.add('on');
    $('keyOnly').hidden = up;
    $('upOnly').hidden = !up;
    const jobs = up ? [decode($('userBox'), KEY.user), decode($('passBox'), KEY.pass)] : [decode($('keyBox'), KEY.key)];
    Promise.all(jobs).then(() => {
      burst();
      document.querySelectorAll('.actions').forEach((a) => a.classList.add('on'));
    });
  }

  // ---------- salin ----------
  document.querySelectorAll('[data-copy]').forEach((btn) => {
    const lbl = btn.querySelector('span'), orig = lbl.textContent;
    btn.addEventListener('click', async () => {
      const v = { key: KEY.key, user: KEY.user, pass: KEY.pass }[btn.dataset.copy];
      try { await navigator.clipboard.writeText(v); lbl.textContent = 'Copied'; btn.classList.add('ok'); }
      catch (e) { lbl.textContent = 'Long-press the text to copy'; }
      setTimeout(() => { lbl.textContent = orig; btn.classList.remove('ok'); }, 2200);
    });
  });

  // ---------- dekorasi ----------
  const star = (c) => '<svg viewBox="0 0 100 100"><polygon points="' + burstPts(12, 46, 34) + '" style="--c:' + c + '"/></svg>';
  const spark = '<svg viewBox="0 0 24 24"><use href="#sp"/></svg>';
  const zig = '<svg viewBox="0 0 100 30" style="fill:none;stroke-width:5"><path d="M4 22 18 8 32 22 46 8 60 22 74 8 88 22"/></svg>';
  [
    { cls: 'spin', html: star('var(--blue)'), css: 'width:120px;height:120px;left:-44px;top:-34px;--t:26s' },
    { cls: 'spin', html: star('var(--yellow)'), css: 'width:42px;height:42px;right:14px;top:84px;--t:14s;animation-direction:reverse' },
    { cls: 'twinkle', html: spark, css: 'width:26px;height:26px;left:16px;top:170px' },
    { cls: 'twinkle', html: spark, css: 'width:22px;height:22px;right:20px;top:42%;animation-delay:.6s' },
    { cls: 'bob half', html: '', css: 'width:84px;height:84px;right:-34px;bottom:120px;--t:6s' },
    { cls: 'bob', html: zig, css: 'width:90px;height:28px;left:16px;bottom:44px;--t:4.5s' }
  ].forEach((d) => {
    const el = document.createElement('div');
    el.className = 'o ' + d.cls;
    el.style.cssText = d.css;
    el.innerHTML = d.html;
    $('deco').appendChild(el);
  });

  function startApp() {
    const up = KEY.mode === 'up';
    if (up ? (!KEY.user || !KEY.pass) : !KEY.key) { $('loadView').innerHTML = '<h2>Key not available</h2><p>The link is invalid or the data has not been filled in.</p>'; return; }
    if (up) {
      $('ldTitle').textContent = 'Creating your key';
      const t = document.querySelectorAll('.step .t'); t[1].textContent = 'Creating key'; t[2].textContent = 'Securing key';
    }
    if (reduce) reveal(); else runLoader(reveal);
  }
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDxlcMvfZ1nhJ8WYbjR_y50N7EaY71gRIY",
  authDomain: "free-key-3024b.firebaseapp.com",
  projectId: "free-key-3024b",
  storageBucket: "free-key-3024b.firebasestorage.app",
  messagingSenderId: "766189284478",
  appId: "1:766189284478:web:524ba727e03eedde53bc2f"
};
// Hitung orang yang mengambil key (0-9999). Dihitung sekali per browser per hari agar refresh tidak menambah.
async function countTake(db, id) {
  const day = new Date().toISOString().slice(0, 10), k = 'kc_' + id;
  try { if (localStorage.getItem(k) === day) return; } catch (e) {}
  try {
    await setDoc(doc(db, 'stats', id), { count: increment(1), last: serverTimestamp() }, { merge: true });
    try { localStorage.setItem(k, day); } catch (e) {}
  } catch (e) { console.error(e); }
}
try {
  if (/^[A-Za-z0-9_-]{1,64}$/.test(APPK)) {
    const db = getFirestore(initializeApp(firebaseConfig));
    const snap = await getDoc(doc(db, 'vpkeys', APPK));
    if (snap.exists()) {
      const d = snap.data(), cid = String(d.app || (/^\d+$/.test(APPK) ? APPK : ''));
      if (cid) countTake(db, cid);
      KEY.mode = d.mode === 'userpass' ? 'up' : 'key';
      KEY.key = String(d.key || '').trim();
      KEY.user = String(d.username || '').trim();
      KEY.pass = String(d.password || '').trim();
      KEY.until = String(d.until || '').trim();
    }
  }
} catch (e) { console.error(e); }
startApp();
</script>
</body>
