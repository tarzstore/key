<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TARZ STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{color-scheme:light;--ink:#0b0b0f;--paper:#f4f1ea;--blue:#2f5bff;--tint:#dfe7ff;--white:#fff;
--head:"Archivo Black",Impact,system-ui,sans-serif;--body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;overflow-x:hidden;padding:28px 16px 0;color:var(--ink);font:500 15px/1.4 var(--body);
  background-color:var(--paper);
  background-image:linear-gradient(rgba(11,11,15,.07) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(11,11,15,.07) 1.5px,transparent 1.5px);background-size:32px 32px}
main{position:relative;z-index:1;width:100%;max-width:420px;margin:0 auto}

/* ---------- decorative objects ---------- */
.o{position:fixed;z-index:0;pointer-events:none}
.o svg{display:block;width:100%;height:100%;fill:var(--c,var(--white));stroke:var(--ink);stroke-width:var(--sw,3);stroke-linejoin:round;stroke-linecap:round;overflow:visible}
.o polygon{fill:var(--c,var(--white))}
.spin{animation:spin var(--t,20s) linear infinite}
.bob{animation:bob var(--t,5s) ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.2s ease-in-out infinite}
.half{border:3px solid var(--ink);border-radius:50%;background:radial-gradient(var(--ink) 1.7px,transparent 2.2px) 0 0/10px 10px,var(--tint);box-shadow:4px 4px 0 var(--ink)}
.check{border:3px solid var(--ink);background:conic-gradient(var(--ink) 25%,var(--white) 0 50%,var(--ink) 0 75%,var(--white) 0) 0 0/24px 24px;box-shadow:4px 4px 0 var(--blue)}

/* ---------- header ---------- */
header{margin-bottom:30px;text-align:center}
.brandwrap{position:relative;display:inline-block}
.brand{display:inline-block;padding:11px 22px 9px;border:3px solid var(--ink);border-radius:12px;background:var(--blue);color:var(--white);
  font:400 clamp(26px,8.4vw,34px)/1 var(--head);letter-spacing:.04em;text-transform:uppercase;
  box-shadow:6px 6px 0 var(--ink),11px 11px 0 var(--tint),11px 11px 0 3px var(--ink);
  transform:rotate(-2deg);animation:slam .7s cubic-bezier(.3,1.6,.5,1) both}
.spk{position:absolute;width:26px;height:26px;fill:var(--white);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.spk.a{top:-16px;right:-14px;animation:twinkle 2.2s ease-in-out infinite}
.spk.b{bottom:-8px;left:-16px;width:20px;height:20px;animation:twinkle 2.2s .8s ease-in-out infinite}
h1{display:block;width:max-content;margin:24px auto 0;padding:5px 12px;border-radius:6px;background:var(--ink);color:var(--white);box-shadow:3px 3px 0 var(--blue);
  font:700 12.5px/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;transform:rotate(1.5deg);animation:slam .7s .12s cubic-bezier(.3,1.6,.5,1) both}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px 16px}
.tile{--r:-.8deg;position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;border:3px solid var(--ink);border-radius:16px;background:var(--white);color:var(--ink);text-decoration:none;
  box-shadow:6px 6px 0 var(--ink);transform:rotate(var(--r));transition:transform .15s,box-shadow .15s;
  animation:pop .6s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.2s + var(--i) * .09s)}
.tile:nth-child(even){--r:.8deg}
.num{position:absolute;z-index:2;top:-12px;left:-10px;padding:4px 8px 3px;border:3px solid var(--ink);border-radius:8px;background:var(--white);color:var(--ink);font:400 12px/1 var(--head);transform:rotate(-8deg);box-shadow:2px 2px 0 var(--blue);transition:transform .2s}
.tile:hover .num{transform:rotate(6deg) scale(1.12)}

.logo{width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--tint);color:var(--blue);font:400 30px/1 var(--head)}
.logo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.tile:hover .logo img{transform:scale(1.07) rotate(-1deg)}
.name{display:grid;place-items:center;min-height:2.6em;padding:0 2px;font:700 13.5px/1.25 var(--body);letter-spacing:.02em;text-transform:uppercase;text-align:center}
.go{height:42px;display:flex;align-items:center;justify-content:center;gap:7px;border:3px solid var(--ink);border-radius:10px;background:var(--blue);color:var(--white);
  font:700 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:background .15s,transform .12s,box-shadow .12s}
.go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square;stroke-linejoin:miter;transition:transform .15s}
.go:hover,.go:focus-visible{background:var(--ink)}
.go:hover svg{transform:translateX(3px)}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.go:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* ---------- ticker ---------- */
.ticker{position:relative;z-index:1;margin:48px -24px 0;padding:12px 0 10px;overflow:hidden;border-block:3px solid var(--ink);background:var(--blue);color:var(--white);transform:rotate(-1.5deg);box-shadow:0 6px 0 var(--ink)}
.track{display:flex;width:max-content;animation:marquee 16s linear infinite}
.track span{flex:none;padding:0 14px;font:400 18px/1 var(--head);letter-spacing:.08em;white-space:nowrap}
.ticker-wrap{overflow:hidden;margin:0 -16px;padding:0 0 44px}

@keyframes slam{from{opacity:0;transform:translateY(-24px) rotate(-8deg) scale(1.3)}}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.8) rotate(var(--r))}}
@keyframes bob{to{translate:0 -14px}}
@keyframes spin{to{rotate:360deg}}
@keyframes twinkle{50%{transform:scale(.7) rotate(25deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sp" viewBox="0 0 24 24"><path d="M12 1C13 8 16 11 23 12C16 13 13 16 12 23C11 16 8 13 1 12C8 11 11 8 12 1Z"/></symbol>
</svg>
<div id="deco" aria-hidden="true"></div>
<main>
  <header>
    <span class="brandwrap">
      <div class="brand">TARZ STORE</div>
      <svg class="spk a"><use href="#sp"/></svg>
      <svg class="spk b"><use href="#sp"/></svg>
    </span>
    <h1>Pilih aplikasi</h1>
  </header>
  <div class="grid" id="list"></div>
</main>
<div class="ticker-wrap"><div class="ticker"><div class="track" id="track"></div></div></div>

<script>
  // Isi link VPLink masing-masing aplikasi.
  // Tiap link VPLink tujuannya: https://SITEKAMU/key.html?k=1 (atau 2, 3, 4) sesuai urutan.
  const APPS = [
    { name: 'TARZ PROXY V1',   logo: 'https://i.ibb.co.com/YT3cv6Y3/product.jpg', link: 'https://vplink.in/Key1' },
    { name: 'TARZ MODZ PROXY', logo: 'https://i.ibb.co.com/bhf84LY/product.jpg',  link: 'https://vplink.in/key2' },
    { name: 'TARZ X MODZ',     logo: 'https://i.ibb.co.com/gbv5tGt8/product.jpg', link: 'https://vplink.in/Key3' },
    { name: '8 BALL POOL V10', logo: 'https://i.ibb.co.com/674DCgnZ/product.jpg', link: 'https://vplink.in/Key4' }
  ];

  const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>';
  const list = document.getElementById('list');

  APPS.forEach((app, i) => {
    const a = document.createElement('div');
    a.className = 'tile';
    a.style.setProperty('--i', i);

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = '0' + (i + 1);

    const logo = document.createElement('span');
    logo.className = 'logo';
    const img = new Image();
    img.alt = '';
    img.loading = 'lazy';
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => {
      img.remove();
      logo.textContent = app.name.split(' ').slice(0, 2).map((w) => w[0]).join('');
    };
    img.src = app.logo;
    logo.appendChild(img);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = app.name;

    const go = document.createElement('a');
    go.className = 'go';
    go.href = app.link;
    go.innerHTML = 'Get Key' + ARROW;

    a.append(num, logo, name, go);
    list.appendChild(a);
  });

  // ---------- dekorasi ----------
  const burst = (n, ro, ri) => {
    let p = '';
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? ri : ro, a = (Math.PI * i) / n - Math.PI / 2;
      p += (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1) + ' ';
    }
    return p;
  };
  const star = (c) => '<svg viewBox="0 0 100 100"><polygon points="' + burst(12, 46, 34) + '" style="--c:' + c + '"/></svg>';
  const spark = '<svg viewBox="0 0 24 24"><use href="#sp"/></svg>';
  const zig = '<svg viewBox="0 0 100 30" style="fill:none;stroke-width:5"><path d="M4 22 18 8 32 22 46 8 60 22 74 8 88 22"/></svg>';

  const DECO = [
    { cls: 'spin', html: star('var(--tint)'), css: 'width:130px;height:130px;left:-44px;top:-34px;--t:26s' },
    { cls: 'spin', html: star('var(--blue)'),  css: 'width:48px;height:48px;right:10px;top:84px;--t:14s;animation-direction:reverse' },
    { cls: 'twinkle', html: spark, css: 'width:30px;height:30px;left:12px;top:150px' },
    { cls: 'twinkle', html: spark, css: 'width:24px;height:24px;right:22px;top:310px;animation-delay:.6s' },
    { cls: 'twinkle', html: spark, css: 'width:28px;height:28px;left:34px;bottom:130px;animation-delay:1.1s' },
    { cls: 'bob half', html: '', css: 'width:104px;height:104px;right:-36px;top:400px;--t:6s' },
    { cls: 'bob check', html: '', css: 'width:76px;height:76px;left:-24px;bottom:240px;rotate:14deg;--t:7s' },
    { cls: 'bob', html: zig, css: 'width:96px;height:30px;right:18px;bottom:96px;--t:4.5s' }
  ];
  const deco = document.getElementById('deco');
  DECO.forEach((d) => {
    const el = document.createElement('div');
    el.className = 'o ' + d.cls;
    el.style.cssText = d.css;
    el.innerHTML = d.html;
    deco.appendChild(el);
  });

  // ---------- ticker ----------
  const track = document.getElementById('track');
  const unit = Array.from({ length: 6 }, () => '<span>TARZ STORE</span><span>✦</span>').join('');
  track.innerHTML = unit + unit;
</script>
</body>
</html>
