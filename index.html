<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7fc4ff">
<title>TARZ STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* ============ 1. TOKENS ============ */
:root{
  color-scheme:light;
  --ink:#0b0b0b; --bg:#7fc4ff; --blue:#0b5fd6; --blue-2:#3d8bff; --tint:#e6f3ff; --yellow:#ffd60a; --white:#fff;
  --head:"Archivo Black",Impact,system-ui,sans-serif;
  --body:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bd:3px solid var(--ink);
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.3,1.5,.5,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}

/* ============ 2. BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:var(--safe-t)}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  padding:calc(32px + var(--safe-t)) 16px var(--safe-b);
  color:var(--ink);font:500 15px/1.45 var(--body);
}
/* latar grid: satu layer fixed */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;transform:translateZ(0);
  background:
    radial-gradient(600px 380px at 85% -5%,rgba(11,95,214,.36),transparent 70%),
    linear-gradient(rgba(0,0,0,.06) 1.5px,transparent 1.5px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(0,0,0,.06) 1.5px,transparent 1.5px) 0 0/32px 32px;
}
main,.actions{position:relative;z-index:1;width:100%;max-width:440px;margin-inline:auto}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* ============ 3. LATAR & DEKORASI ============ */
#spot{
  position:fixed;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;z-index:0;pointer-events:none;will-change:transform;
  background:radial-gradient(circle closest-side,rgba(255,255,255,.38),transparent 70%);
}
.deco{position:fixed;z-index:0;pointer-events:none;will-change:transform}
.deco svg{display:block;width:100%;height:100%;overflow:visible;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.deco.star{width:110px;height:110px;left:-40px;top:-30px;opacity:.85;animation:spin 28s linear infinite}
.deco.star2{width:40px;height:40px;right:14px;top:92px;animation:spin 14s linear infinite reverse}
.deco.cloud{width:96px;height:64px;right:-22px;top:520px;animation:drift 12s ease-in-out infinite alternate}
.deco.half{
  width:84px;height:84px;left:-38px;bottom:200px;border:var(--bd);border-radius:50%;opacity:.9;
  background:radial-gradient(var(--ink) 1.7px,transparent 2.2px) 0 0/10px 10px,var(--yellow);
  box-shadow:4px 4px 0 var(--blue);animation:bob 6s ease-in-out infinite alternate;
}

@media (max-width:600px){.deco.cloud,.deco.half{display:none}}
@media (hover:none){#spot{display:none}}

/* ============ 4. HEADER ============ */
header{margin-bottom:38px;text-align:center}
.brandwrap{position:relative;display:inline-block}
.brand{
  position:relative;overflow:hidden;display:inline-block;padding:13px 24px 10px;
  border:var(--bd);border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue-2));color:var(--white);
  font:400 clamp(28px,9vw,38px)/1 var(--head);letter-spacing:.04em;text-transform:uppercase;text-shadow:2px 2px 0 var(--ink);
  box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink);
  transform:rotate(-2deg);animation:slam .7s var(--ease) both;
}
.brand::after{
  content:"";position:absolute;inset:0 auto 0 0;width:36%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-167%) skewX(-18deg);animation:shine 3.6s 1.2s ease-in-out infinite;
}
.spk{position:absolute;width:24px;height:24px;fill:var(--yellow);stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;animation:twinkle 2.2s ease-in-out infinite}
.spk.a{top:-16px;right:-14px}
.spk.b{bottom:-8px;left:-16px;width:18px;height:18px;animation-delay:.8s}

.hero{
  margin:26px 0 0;font:400 clamp(22px,7vw,28px)/1.15 var(--head);letter-spacing:.01em;
  text-shadow:2px 2px 0 var(--white);animation:slam .7s .1s var(--ease) both;
}
.sub{max-width:30ch;margin:10px auto 0;color:rgba(0,0,0,.68);font-size:14px;animation:slam .7s .16s var(--ease) both}

.steps{display:flex;justify-content:center;align-items:center;gap:22px;margin:22px 0 0;padding:0;list-style:none;animation:slam .7s .22s var(--ease) both}
.steps li{
  position:relative;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;
  border:var(--bd);border-radius:999px;background:var(--white);box-shadow:3px 3px 0 var(--ink);
  font:700 12.5px/1 var(--body);white-space:nowrap;
}
.steps li:not(:last-child)::after{
  content:"";position:absolute;left:calc(100% + 5px);top:50%;width:12px;height:3px;margin-top:-1.5px;background:var(--ink);
}
.steps b{
  width:22px;height:22px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;
  background:var(--yellow);font:400 11px/1 var(--head);
}
.steps li:nth-child(2) b{background:var(--blue);color:var(--white)}

.status{
  display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:20px auto 0;padding:7px 14px;
  border:2px solid rgba(0,0,0,.2);border-radius:999px;background:rgba(255,255,255,.6);
  font:700 13px/1.3 var(--body);animation:slam .7s .28s var(--ease) both;
}
.dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--ink)}
.dot::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;background:rgba(255,214,10,.8);animation:ping 1.8s infinite}

@media (max-width:360px){.steps{gap:15px}.steps li{gap:5px;padding-right:9px;font-size:12px}.steps li:not(:last-child)::after{width:9px}}

/* ============ 5. KARTU APLIKASI ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 16px}
@media (hover:hover) and (pointer:fine){
  .tile{transform:perspective(900px) rotate(var(--r)) rotateX(var(--rx)) rotateY(var(--ry))}
}
.tile{
  --r:-.8deg;--rx:0deg;--ry:0deg;--sh:var(--yellow);
  position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;
  border:var(--bd);border-radius:var(--r-lg);background:var(--white);
  box-shadow:6px 6px 0 var(--sh),6px 6px 0 3px var(--ink);
  transform:rotate(var(--r));transition:transform .18s ease-out;contain:layout style;
  animation:pop .6s var(--ease) backwards;animation-delay:calc(.2s + var(--i) * .09s);
}
.tile:nth-child(even){--r:.8deg;--sh:var(--blue)}
.tile:hover{box-shadow:10px 10px 0 var(--sh),10px 10px 0 3px var(--ink)}

.badge{
  position:absolute;z-index:2;top:-13px;right:-9px;padding:4px 9px 3px;
  border:var(--bd);border-radius:8px;background:var(--yellow);box-shadow:2px 2px 0 var(--ink);
  font:400 11px/1 var(--head);letter-spacing:.06em;transform:rotate(7deg);animation:wiggle 3s ease-in-out infinite;
}
.logo{
  position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;
  border:var(--bd);border-radius:var(--r-md);background:var(--tint);color:var(--blue);font:400 30px/1 var(--head);
}
.logo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.logo::after{
  content:"";position:absolute;inset:0;transform:translateX(-120%);transition:transform .6s;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
}
.tile:hover .logo::after{transform:translateX(120%)}
.tile:hover .logo img{transform:scale(1.07)}
.name{
  display:block;min-height:1.6em;padding-top:2px;overflow:hidden;white-space:nowrap;text-align:center;
  font:400 19px/1.2 var(--head);text-transform:uppercase;
}

/* tombol */
.btns{display:grid;gap:10px}
.go{
  height:44px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:var(--bd);border-radius:10px;background:var(--blue);color:var(--white);box-shadow:3px 3px 0 var(--ink);
  font:700 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  transition:transform .12s;
}
.go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:square;transition:transform .15s}
.go:hover{background:var(--ink)}
.go:hover svg{transform:translateX(3px)}
.go.install{background:var(--yellow);color:var(--ink)}
.go.install:hover{background:var(--white)}
.go.install:hover svg{transform:translateY(3px)}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* loading & kosong */
.sk{height:300px;border:3px solid rgba(0,0,0,.12);border-radius:var(--r-lg);background:linear-gradient(100deg,rgba(255,255,255,.2) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.2) 70%) 0 0/300% 100%;animation:sheen 1.3s linear infinite}
.empty{grid-column:1/-1;padding:28px 18px;border:var(--bd);border-radius:var(--r-lg);background:var(--white);box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink);text-align:center}
.empty b{display:block;margin-bottom:4px;font:400 18px/1.2 var(--head);text-transform:uppercase}

/* ============ 6. TOMBOL AKSI ============ */
.actions{display:grid;gap:20px;margin-top:40px}
.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;padding:0;
  border:var(--bd);border-radius:14px;background:var(--yellow);color:var(--ink);cursor:pointer;
  box-shadow:5px 5px 0 var(--blue),5px 5px 0 3px var(--ink);text-decoration:none;
  font:400 17px/1 var(--head);text-transform:uppercase;appearance:none;-webkit-appearance:none;
  transform:rotate(-.8deg);animation:pop .6s .15s var(--ease) backwards;transition:transform .12s;
}
.cta .ico{flex:none;width:32px;height:32px;display:grid;place-items:center;border:var(--bd);border-radius:var(--r-sm);background:var(--blue);box-shadow:2px 2px 0 var(--ink);animation:beat 1.6s ease-in-out infinite}
.cta .ico svg{width:14px;height:14px;fill:var(--white)}
.cta:hover{background:var(--white)}
.cta:active{transform:translate(3px,3px) rotate(-.8deg);box-shadow:1px 1px 0 var(--ink)}
.cta.buy{background:var(--blue);color:var(--white);box-shadow:5px 5px 0 var(--yellow),5px 5px 0 3px var(--ink);transform:rotate(.8deg);animation-delay:.3s}
.cta.buy .ico{background:var(--yellow);animation-delay:.4s}
.cta.buy .ico svg{fill:var(--ink)}
.cta.buy:hover{background:var(--ink)}
.cta.buy:active{transform:translate(3px,3px) rotate(.8deg)}

/* ============ 7. MODAL VIDEO ============ */
.vmodal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:max(16px,var(--safe-t)) 16px max(16px,var(--safe-b));background:rgba(0,0,0,.75)}
.vmodal[hidden]{display:none}
.vbox{width:100%;max-width:440px;overflow:hidden;border:var(--bd);border-radius:16px;background:var(--white);box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink);animation:pop .35s var(--ease) backwards}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-bottom:var(--bd);background:var(--yellow);font:400 15px/1 var(--head);text-transform:uppercase}
.vx{flex:none;width:36px;height:36px;display:grid;place-items:center;padding:0;border:var(--bd);border-radius:var(--r-sm);background:var(--blue);color:var(--white);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.vx svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:square}
.vx:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.vbox video{display:block;width:100%;max-height:calc(100svh - 150px);background:#000;object-fit:contain}

/* ============ 8. TICKER ============ */
.ticker-wrap{content-visibility:auto;contain-intrinsic-size:auto 200px;position:relative;z-index:1;overflow:hidden;margin:0 -16px;padding:56px 0 52px}
.ticker{margin:0 -24px;padding:12px 0 10px;overflow:hidden;border-block:var(--bd);background:var(--yellow);color:var(--ink);transform:rotate(-1.5deg);box-shadow:0 6px 0 var(--blue)}
.ticker.rev{margin-top:16px;background:var(--blue);color:var(--white);transform:rotate(1.2deg);box-shadow:0 6px 0 var(--ink)}
.track{display:flex;width:max-content;will-change:transform;animation:marquee 16s linear infinite}
.rev .track{animation-direction:reverse;animation-duration:20s}
.track span{flex:none;padding:0 14px;font:400 18px/1 var(--head);letter-spacing:.08em;white-space:nowrap}

/* ============ 9. ANIMASI ============ */
.is-scrolling .deco,.is-scrolling .badge,.is-scrolling .cta .ico,.is-scrolling .spk,
.is-scrolling .brand::after,.is-scrolling .dot::after{animation-play-state:paused}
.track:not(.on){animation-play-state:paused}
@keyframes drift{to{translate:26px 0}}
@keyframes bob{to{translate:0 -14px}}
@keyframes spin{to{rotate:360deg}}
@keyframes slam{from{opacity:0;transform:translateY(-24px) rotate(-8deg) scale(1.3)}}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.8) rotate(var(--r,0deg))}}
@keyframes twinkle{50%{transform:scale(.7) rotate(25deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes shine{0%,55%{transform:translateX(-167%) skewX(-18deg)}100%{transform:translateX(361%) skewX(-18deg)}}
@keyframes ping{from{transform:scale(1);opacity:.7}70%,100%{transform:scale(3);opacity:0}}
@keyframes wiggle{50%{transform:rotate(-3deg) scale(1.06)}}
@keyframes beat{50%{transform:scale(1.12)}}
@keyframes sheen{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
  #spot{display:none}
}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDxlcMvfZ1nhJ8WYbjR_y50N7EaY71gRIY",
  authDomain: "free-key-3024b.firebaseapp.com",
  projectId: "free-key-3024b",
  storageBucket: "free-key-3024b.firebasestorage.app",
  messagingSenderId: "766189284478",
  appId: "1:766189284478:web:524ba727e03eedde53bc2f"
};
const VIDEO_URL = 'https://www.image2url.com/r2/default/videos/1791217347389-40c7c65a-caba-4cbc-bb27-1a85657fc5c4.mp4';

// Cadangan bila database kosong / gagal dimuat. Daftar utama diatur dari admin2.html.
const FALLBACK = [
  { name: 'TARZ PROXY V1',   logo: 'https://i.ibb.co.com/YT3cv6Y3/product.jpg', install: 'https://www.mediafire.com/file/cw9f4lmkrwjx8ff/TarzProxy.apk/file', link: 'https://vplink.in/tarz1' },
  { name: 'TARZ MODZ PROXY', logo: 'https://i.ibb.co.com/bhf84LY/product.jpg',  install: 'https://www.mediafire.com/file/3wguz3vn187z1ch/Tarz_Modz_Proxy.release.apk/file', link: 'https://vplink.in/bhjfcff' },
  { name: 'TARZ X MODZ',     logo: 'https://i.ibb.co.com/gbv5tGt8/product.jpg', install: 'https://www.mediafire.com/file/pj1iipmidto2xr6/TARZ+MODZ+V3.apk/file', link: 'https://vplink.in/bhjjnbb' },
  { name: '8 BALL POOL V10', logo: 'https://i.ibb.co.com/674DCgnZ/product.jpg', install: 'https://www.mediafire.com/file/81gji9qdaqofycn/8+Ball+Poll+V10.apk/file', link: 'https://vplink.in/bhjcxxz' }
];

/* ================= HELPERS ================= */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, props = {}) => Object.assign(document.createElement(tag), { className: cls || '', ...props });
const ICON = {
  down:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M6 11l6 6 6-6M4 21h16"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>'
};
// URL hanya boleh http(s) — mencegah javascript: dari data database
const safeUrl = (u) => { try { return /^https?:$/.test(new URL(u).protocol) ? u : ''; } catch { return ''; } };

/* ================= DATA ================= */
async function loadApps() {
  try {
    const db = getFirestore(initializeApp(firebaseConfig));
    const snap = await Promise.race([
      getDocs(collection(db, 'apps')),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))
    ]);
    if (snap.empty) return FALLBACK;
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .filter((r) => r.name && safeUrl(r.link) && r.active !== false)
      .sort((a, b) => (a.order ?? Number(a.id)) - (b.order ?? Number(b.id)));
  } catch (e) {
    console.warn('Using fallback data:', e);
    return FALLBACK;
  }
}

/* ================= KARTU ================= */
function makeTile(app, i) {
  const tile = el('div', 'tile');
  tile.style.setProperty('--i', i);

  const badge = el('span', 'badge', { textContent: 'FREE' });

  const logo = el('span', 'logo');
  const initials = () => { logo.textContent = app.name.split(' ').slice(0, 2).map((w) => w[0]).join(''); };
  if (safeUrl(app.logo)) {
    const img = el('img', '', { alt: '', loading: 'lazy', decoding: 'async', referrerPolicy: 'no-referrer', src: app.logo });
    img.onerror = () => { img.remove(); initials(); };
    logo.append(img);
  } else initials();

  const name = el('span', 'name', { textContent: app.name });

  const btns = el('div', 'btns');
  if (safeUrl(app.install)) {
    const ins = el('a', 'go install', { href: app.install, target: '_blank', rel: 'noopener', innerHTML: 'Install' + ICON.down });
    ins.setAttribute('aria-label', 'Install ' + app.name);
    btns.append(ins);
  }
  const key = el('a', 'go', { href: app.link, innerHTML: 'Get Key' + ICON.arrow });
  key.setAttribute('aria-label', 'Get key for ' + app.name);
  btns.append(key);

  tile.append(badge, logo, name, btns);

  // miring 3D mengikuti kursor (hanya perangkat dengan mouse)
  if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
    tile.addEventListener('pointermove', (e) => {
      const r = tile.getBoundingClientRect();
      tile.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 10 + 'deg');
      tile.style.setProperty('--rx', (.5 - (e.clientY - r.top) / r.height) * 10 + 'deg');
    });
    tile.addEventListener('pointerleave', () => { tile.style.setProperty('--rx', '0deg'); tile.style.setProperty('--ry', '0deg'); });
  }
  return tile;
}

// Nama selalu 1 baris: kecilkan font bila kepanjangan (baca semua dulu, tulis kemudian)
function fitNames() {
  const els = [...document.querySelectorAll('.name')];
  els.forEach((n) => { n.style.fontSize = ''; });
  const m = els.map((n) => ({ n, size: parseFloat(getComputedStyle(n).fontSize), sw: n.scrollWidth, cw: n.clientWidth }));
  m.forEach(({ n, size, sw, cw }) => {
    if (sw > cw && sw > 0) n.style.fontSize = Math.max(9, Math.floor(size * cw / sw * 2 - .01) / 2) + 'px';
  });
}

async function render() {
  const list = $('list');
  const apps = await loadApps();
  list.replaceChildren();
  list.removeAttribute('aria-busy');
  $('count').textContent = apps.length ? apps.length + ' apps ready to use' : 'No apps yet';

  if (!apps.length) {
    const empty = el('div', 'empty');
    empty.innerHTML = '<b>No apps yet</b>Check back soon — new apps are added here.';
    list.append(empty);
    return;
  }
  apps.forEach((app, i) => list.append(makeTile(app, i)));
  fitNames();
  document.fonts?.ready.then(fitNames);
}

let lastW = innerWidth, raf = 0;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;           // abaikan perubahan tinggi (address bar HP)
  lastW = innerWidth;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(fitNames);
});

/* ================= SOROTAN CAHAYA ================= */
let scrollT = 0;
addEventListener('scroll', () => {
  document.documentElement.classList.add('is-scrolling');
  clearTimeout(scrollT);
  scrollT = setTimeout(() => document.documentElement.classList.remove('is-scrolling'), 140);
}, { passive: true });

const io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle('on', e.isIntersecting)), { rootMargin: '100px' });
document.querySelectorAll('.track').forEach((t) => io.observe(t));

const spot = $('spot');
let sx = innerWidth / 2, sy = innerHeight * .2, spotRaf = 0;
const placeSpot = () => { spotRaf = 0; spot.style.transform = `translate3d(${sx}px,${sy}px,0)`; };
placeSpot();
if (matchMedia('(hover:hover) and (pointer:fine)').matches) addEventListener('pointermove', (e) => {
  sx = e.clientX; sy = e.clientY;
  if (!spotRaf) spotRaf = requestAnimationFrame(placeSpot);
}, { passive: true });

/* ================= MODAL VIDEO ================= */
const vmodal = $('vmodal'), vplayer = $('vplayer'), tutBtn = $('tutBtn'), vclose = $('vclose');
function openTut() {
  vplayer.src = VIDEO_URL;
  vmodal.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  vplayer.play().catch(() => {});
  vclose.focus();
}
function closeTut() {
  vplayer.pause();
  vplayer.removeAttribute('src');
  vplayer.load();
  vmodal.hidden = true;
  document.documentElement.style.overflow = '';
  tutBtn.focus();
}
tutBtn.addEventListener('click', openTut);
vclose.addEventListener('click', closeTut);
vmodal.addEventListener('click', (e) => { if (e.target === vmodal) closeTut(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !vmodal.hidden) closeTut(); });

/* ================= DEKORASI & TICKER ================= */
// bintang bergerigi (12 titik) dibuat sekali, dipakai ulang lewat <use>
(() => {
  let p = '';
  for (let i = 0; i < 24; i++) {
    const r = i % 2 ? 34 : 46, a = Math.PI * i / 12 - Math.PI / 2;
    p += (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1) + ' ';
  }
  $('burstPts').setAttribute('points', p);
})();

const strip = (t) => Array.from({ length: 12 }, () => `<span>${t}</span><span>✦</span>`).join('');
$('track').innerHTML  = strip('TARZ STORE');
$('track2').innerHTML = strip('FREE KEY');

render();
</script>
